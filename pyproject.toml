[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "wave-equation-simulator"
version = "2.3.0"
description = "Interactive 2D wave equation laboratory"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "streamlit>=1.32", "plotly>=5.18", "Pillow>=10", "imageio>=2.34", "imageio-ffmpeg>=0.5"]
[project.optional-dependencies]
dev = ["pytest>=7"]
[tool.setuptools.packages.find]
where = ["src"]
